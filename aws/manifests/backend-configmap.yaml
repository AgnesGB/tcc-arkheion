apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
data:
  DEBUG: "False"
  DB_ENGINE: "django.db.backends.postgresql"
  DB_NAME: "arkheion_db"
  DB_USER: "arkheion_user"
  DB_HOST: "postgres"
  DB_PORT: "5432"
  ALLOWED_HOSTS: "*"
  CORS_ALLOW_ALL_ORIGINS: "True"
  CORS_ALLOWED_ORIGINS: "http://localhost:5173"
  CSRF_TRUSTED_ORIGINS: "http://localhost:8000"
