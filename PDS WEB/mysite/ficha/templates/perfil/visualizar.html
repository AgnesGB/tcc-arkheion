<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% load static %}
    <link rel="icon" type="image/png" href="{% static 'favicon.png' %}">
    <title>Visualizar Perfil</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.2/css/bulma.min.css">
    <style>
        /* Estilos personalizados */
        .hero.is-light {
            background-color: #f5f5f5;
        }
        .box {
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .title {
            color: #363636;
        }
        .subtitle {
            color: #4a4a4a;
        }
        .button.is-dark {
            background-color: #363636;
            transition: background-color 0.3s ease;
        }
        .button.is-dark:hover {
            background-color: #292929;
        }
        .button.is-light {
            transition: background-color 0.3s ease;
        }
        .button.is-light:hover {
            background-color: #e8e8e8;
        }
        .notification {
            margin-bottom: 1.5rem;
        }
        .profile-info {
            margin-bottom: 1.5rem;
        }
        .profile-info p {
            margin-bottom: 0.5rem;
        }
    </style>
</head>
<body class="has-background-light">
    <section class="hero is-light is-fullheight">
        <div class="hero-body">
            <div class="container">
                <div class="columns is-centered">
                    <div class="column is-two-thirds">
                        <div class="box">
                            <h2 class="title has-text-centered">Meu Perfil</h2>

                            <!-- Exibe mensagens de sucesso/erro -->
                            {% if messages %}
                                {% for message in messages %}
                                    <div class="notification is-{{ message.tags }}">
                                        {{ message }}
                                    </div>
                                {% endfor %}
                            {% endif %}

                            <!-- Informações do Perfil -->
                            <div class="profile-info">
                                <p><strong>Nome:</strong> {{ user.username }}</p>
                                <p><strong>E-mail:</strong> {{ user.email }}</p>
                                <p><strong>Senha:</strong> ********</p>
                            </div>

                            <!-- Botões de Ação -->
                            <div class="buttons is-centered">
                                <a href="{% url 'alterar_nome' %}" class="button is-dark">Alterar Nome</a>
                                <a href="{% url 'alterar_email' %}" class="button is-dark">Alterar E-mail</a>
                                <a href="{% url 'alterar_senha' %}" class="button is-dark">Alterar Senha</a>
                            </div>
                            <div>
                                <a href="{% url 'index' %}" class="button is-primary">Voltar</a>
                                <form method="post" action="{% url 'excluir_conta' %}" style="display: inline;">
                                    {% csrf_token %}
                                    <button type="submit" class="button is-danger" onclick="return confirm('Tem certeza que deseja excluir sua conta? Esta ação não pode ser desfeita.')">Excluir Conta</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
